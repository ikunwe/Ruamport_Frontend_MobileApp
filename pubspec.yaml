name: project_portfoliomanagement_mobile
description: Ruamport mobile portfolio UI.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.12.2 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  font_awesome_flutter: ^11.0.0
  supabase_flutter: ^2.18.3
  app_links: ^7.2.2
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.3.0
  url_launcher: ^6.3.3
  http_parser: ^4.1.2
  web: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/branding/
  fonts:
    - family: Kanit
      fonts:
        - asset: assets/fonts/Kanit-Regular.ttf
        - asset: assets/fonts/Kanit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Kanit-Bold.ttf
          weight: 700
